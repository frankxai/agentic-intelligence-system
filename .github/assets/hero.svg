<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
<defs>
  <radialGradient id="bg-ais" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#001215"/>
    <stop offset="100%" stop-color="#0a0a0b"/>
  </radialGradient>
  <linearGradient id="route-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
    <stop offset="50%" stop-color="#10b981"/>
    <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3"/>
  </linearGradient>
  <filter id="node-glow-ais">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="300" fill="url(#bg-ais)"/>

<!-- Route paths between nodes (bottom layer) -->
<!-- Path 1→2 -->
<path d="M 240 110 C 290 110 310 110 360 110" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,3" opacity="0.4">
  <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.2s" repeatCount="indefinite"/>
</path>
<!-- Path 2→3 -->
<path d="M 440 110 C 490 110 510 110 560 110" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,3" opacity="0.5">
  <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.0s" repeatCount="indefinite"/>
</path>
<!-- Path 3→4 -->
<path d="M 640 110 C 690 110 710 110 760 110" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3" opacity="0.6">
  <animate attributeName="stroke-dashoffset" values="0;-18" dur="0.9s" repeatCount="indefinite"/>
</path>
<!-- Path 4→5 -->
<path d="M 840 110 C 890 110 910 110 960 110" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.7">
  <animate attributeName="stroke-dashoffset" values="0;-18" dur="0.8s" repeatCount="indefinite"/>
</path>

<!-- Routing pulse travelling left to right -->
<circle r="5" fill="#06b6d4" opacity="0.9">
  <animateMotion dur="3s" repeatCount="indefinite" path="M 180 110 L 980 110"/>
  <animate attributeName="opacity" values="0;0.9;0.9;0" dur="3s" repeatCount="indefinite"/>
</circle>
<circle r="3" fill="#10b981" opacity="0.7">
  <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M 180 110 L 980 110"/>
  <animate attributeName="opacity" values="0;0.7;0.7;0" dur="3s" begin="1s" repeatCount="indefinite"/>
</circle>

<!-- Node 1 - Trivial (leftmost, smallest, dim) -->
<circle cx="200" cy="110" r="26" fill="#0a0a0b" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
<text x="200" y="106" fill="#06b6d4" font-family="ui-monospace,monospace" font-size="8" font-weight="700" text-anchor="middle">Trivial</text>
<text x="200" y="117" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="7" text-anchor="middle">1-3</text>
<text x="200" y="144" fill="#475569" font-family="ui-monospace,monospace" font-size="8" text-anchor="middle">OpenCode</text>

<!-- Node 2 -->
<circle cx="400" cy="110" r="30" fill="#0a0a0b" stroke="#06b6d4" stroke-width="2" opacity="0.8"/>
<text x="400" y="106" fill="#06b6d4" font-family="ui-monospace,monospace" font-size="8" font-weight="700" text-anchor="middle">Medium</text>
<text x="400" y="117" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="7" text-anchor="middle">4-6</text>
<text x="400" y="148" fill="#475569" font-family="ui-monospace,monospace" font-size="8" text-anchor="middle">Cursor / Cline</text>

<!-- Node 3 -->
<circle cx="600" cy="110" r="34" fill="#0a0a0b" stroke="#10b981" stroke-width="2.5" opacity="0.9" filter="url(#node-glow-ais)"/>
<text x="600" y="106" fill="#10b981" font-family="ui-monospace,monospace" font-size="8" font-weight="700" text-anchor="middle">High</text>
<text x="600" y="117" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="7" text-anchor="middle">7-8</text>
<text x="600" y="152" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="8" text-anchor="middle">Claude Code</text>

<!-- Node 4 -->
<circle cx="800" cy="110" r="36" fill="#0a0a0b" stroke="#10b981" stroke-width="3" opacity="0.95" filter="url(#node-glow-ais)"/>
<text x="800" y="106" fill="#10b981" font-family="ui-monospace,monospace" font-size="8" font-weight="700" text-anchor="middle">Substrate</text>
<text x="800" y="117" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="7" text-anchor="middle">9-10</text>
<text x="800" y="154" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="8" text-anchor="middle">SIS Swarm</text>

<!-- Node 5 - rightmost, largest (substrate) -->
<circle cx="1000" cy="110" r="40" fill="#052010" stroke="#10b981" stroke-width="3" opacity="1" filter="url(#node-glow-ais)">
  <animate attributeName="stroke-width" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
</circle>
<text x="1000" y="105" fill="#10b981" font-family="ui-monospace,monospace" font-size="8" font-weight="700" text-anchor="middle">Deep</text>
<text x="1000" y="116" fill="#10b981" font-family="ui-monospace,monospace" font-size="8" font-weight="700" text-anchor="middle">Agent</text>
<text x="1000" y="159" fill="#10b981" font-family="ui-monospace,monospace" font-size="8" text-anchor="middle">Long-horizon</text>

<!-- Complexity label under route -->
<text x="590" y="175" fill="#334155" font-family="ui-monospace,monospace" font-size="10" text-anchor="middle">simple ←——————————————————→ complex</text>

<!-- Title -->
<text x="600" y="218" fill="#06b6d4" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="27" font-weight="700" text-anchor="middle" letter-spacing="2">AGENTIC INTELLIGENCE SYSTEM</text>
<text x="600" y="243" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13" text-anchor="middle">Discovery · Routing · Capabilities orchestration for AI agents</text>

<!-- Built on SIP -->
<text x="24" y="275" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" opacity="0.8">Built on SIP</text>

<!-- Right accent -->
<line x1="900" y1="275" x2="1176" y2="275" stroke="#06b6d4" stroke-width="0.5" opacity="0.3"/>
</svg>