name: Reconcile and attest Tattoo Atelier release

on:
  push:
    branches:
      - ops/tattoo-atelier-release-reconcile-20260901
    paths:
      - .github/workflows/reconcile-tattoo-atelier-release.yml
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  deployments: read
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: tattoo-atelier-release-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROL_BRANCH: ops/tattoo-atelier-release-reconcile-20260901
      RELEASE_BRANCH: feat/tattoo-atelier-reference-app
      OVERLAY_URL: https://res.cloudinary.com/daa4wmehz/raw/upload/v1756749333/bootstrap/tattoo-atelier-overlay-20260901.tgz
      OVERLAY_SIZE: '371519'
      OVERLAY_MD5: babaf2ef89bd9741387d70d9eea8c491
      FALLBACK_PRODUCTION_URL: https://agentic-intelligence-system.vercel.app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/tattoo-atelier-release-reconcile-20260901
          fetch-depth: 0
          persist-credentials: true

      - name: Cancel superseded Tattoo Atelier controllers
        run: |
          set -euo pipefail
          current="$GITHUB_RUN_ID"
          for state in queued in_progress; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${RELEASE_BRANCH}&status=${state}&per_page=100" \
              --jq '.workflow_runs[] | [.id, .name] | @tsv' 2>/dev/null | \
            while IFS=$'\t' read -r id name; do
              [[ -n "$id" ]] || continue
              [[ "$id" == "$current" ]] && continue
              case "$name" in
                *Tattoo*|*tattoo*)
                  gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
                  ;;
              esac
            done
          done

      - name: Start from the current default branch
        id: source
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git checkout -B tattoo-release-work origin/main
          main_sha="$(git rev-parse HEAD)"
          echo "main_sha=${main_sha}" >> "$GITHUB_OUTPUT"

          if [[ -f app/page.tsx ]] && [[ -f app/mcp/route.ts ]] && grep -Eqi 'Tattoo Atelier|Tattoo Intelligence' app/page.tsx; then
            echo 'already_on_main=true' >> "$GITHUB_OUTPUT"
            echo 'Tattoo Atelier already exists on main; this run will reproduce the gate and attest production.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'already_on_main=false' >> "$GITHUB_OUTPUT"
            curl --fail --location --retry 6 --retry-all-errors "$OVERLAY_URL" --output /tmp/tattoo-atelier-overlay.tgz
            test "$(stat -c%s /tmp/tattoo-atelier-overlay.tgz)" = "$OVERLAY_SIZE"
            echo "${OVERLAY_MD5}  /tmp/tattoo-atelier-overlay.tgz" | md5sum --check --strict
            tar --extract --gzip --file /tmp/tattoo-atelier-overlay.tgz --directory . --overwrite
            rm -rf .bootstrap
            rm -f \
              .github/workflows/bootstrap-tattoo-atelier.yml \
              .github/workflows/promote-tattoo-atelier.yml \
              .github/workflows/reconcile-tattoo-atelier-release.yml
            echo 'Materialized the immutable Tattoo Atelier release overlay on current main.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install deterministically
        run: |
          set -euo pipefail
          if [[ '${{ steps.source.outputs.already_on_main }}' == 'true' ]]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Reproduce all release gates
        run: |
          set -euo pipefail
          pnpm validate:tattoo
          pnpm typecheck
          pnpm test
          BASE_URL=http://127.0.0.1:3017 TATTOO_PUBLIC_AI_ENABLED=false pnpm build
          pnpm smoke:web

      - name: Publish a clean release head when main is missing the product
        id: release
        run: |
          set -euo pipefail
          if [[ '${{ steps.source.outputs.already_on_main }}' == 'true' ]]; then
            release_sha="$(git rev-parse HEAD)"
            echo 'requires_merge=false' >> "$GITHUB_OUTPUT"
            echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'feat: ship Tattoo Atelier reference app'
          release_sha="$(git rev-parse HEAD)"
          git push --force origin HEAD:${RELEASE_BRANCH}
          echo 'requires_merge=true' >> "$GITHUB_OUTPUT"
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"
          echo "Verified release head: ${release_sha}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or normalize the release pull request
        if: steps.release.outputs.requires_merge == 'true'
        id: pr
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${owner}:${RELEASE_BRANCH}&per_page=20" --jq '.[0].number // empty')"
          body_file=/tmp/tattoo-pr.md
          cat > "$body_file" <<'EOF'
          ## Decision

          Ship Tattoo Atelier as the first bounded vertical reference application of the Agentic Intelligence System—not as a disposable tattoo generator or disconnected prompt repository.

          ## Included

          - Premium Next.js website and interactive tattoo studio
          - Typed deterministic tattoo-intelligence engine
          - Six read-only MCP/App tools at `/mcp`
          - REST boundaries, local-only placement imagery, privacy and threat model
          - Portable skill packs, evals, tests, runtime smoke and release documentation
          - Optional Vercel AI Gateway enhancement behind an explicit public-enable gate

          ## Governance

          Generated outputs are concept studies and artist handoffs, never execution-ready stencils. The tattoo artist retains final authorship and responsibility for anatomy, drawing, sanitation, execution and refusal. Body photographs remain in browser memory and are not uploaded.

          ## Gate

          This head was rebuilt from current `main`, installed deterministically, validated, typechecked, tested, production-built and runtime-smoked before publication. Merge remains exact-SHA gated through GitHub checks and Vercel.
          EOF

          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$RELEASE_BRANCH" --base main --title 'feat: ship Tattoo Atelier — tattoo intelligence reference app' --body-file "$body_file" --draft)"
            pr_number="${pr_url##*/}"
          else
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --title 'feat: ship Tattoo Atelier — tattoo intelligence reference app' --body-file "$body_file"
          fi
          gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          echo "number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/pull/${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub and Vercel checks on the exact head
        if: steps.release.outputs.requires_merge == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))
          while (( SECONDS < deadline )); do
            checks="$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json name,state,link 2>/dev/null || true)"
            count="$(jq 'length' <<<"${checks:-[]}" 2>/dev/null || echo 0)"
            if (( count > 0 )); then
              failed="$(jq '[.[] | select(.state == "FAILURE" or .state == "ERROR" or .state == "CANCELLED" or .state == "TIMED_OUT" or .state == "ACTION_REQUIRED")] | length' <<<"$checks")"
              pending="$(jq '[.[] | select(.state == "PENDING" or .state == "QUEUED" or .state == "IN_PROGRESS" or .state == "WAITING" or .state == "REQUESTED")] | length' <<<"$checks")"
              if (( failed > 0 )); then
                jq . <<<"$checks"
                echo 'A pull-request check failed.' >&2
                exit 1
              fi
              if (( pending == 0 )); then
                jq . <<<"$checks"
                echo 'All published pull-request checks passed.'
                break
              fi
            fi
            sleep 15
          done
          (( SECONDS < deadline )) || { echo 'Timed out waiting for pull-request checks.' >&2; exit 1; }

          remote_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_BRANCH}" --jq '.object.sha')"
          [[ "$remote_sha" == "$RELEASE_SHA" ]] || { echo "Release head moved from ${RELEASE_SHA} to ${remote_sha}." >&2; exit 1; }

      - name: Attempt live preview smoke
        if: steps.release.outputs.requires_merge == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          preview_url=''
          while (( SECONDS < deadline )); do
            deployments="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${RELEASE_SHA}&per_page=100" 2>/dev/null || echo '[]')"
            mapfile -t ids < <(jq -r '.[] | select(((.environment // "") | ascii_downcase | contains("preview")) or ((.environment // "") | ascii_downcase | contains("development"))) | .id' <<<"$deployments")
            for id in "${ids[@]:-}"; do
              [[ -n "$id" ]] || continue
              statuses="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=100" 2>/dev/null || echo '[]')"
              if jq -e '.[] | select(.state == "failure" or .state == "error")' <<<"$statuses" >/dev/null; then
                echo "Preview deployment ${id} failed." >&2
                exit 1
              fi
              preview_url="$(jq -r '[.[] | select(.state == "success") | (.environment_url // .target_url // empty) | select(startswith("http"))][0] // empty' <<<"$statuses")"
              [[ -n "$preview_url" ]] && break 2
            done
            sleep 15
          done

          if [[ -z "$preview_url" ]]; then
            echo 'Vercel checks passed but no preview URL was exposed through GitHub Deployments; production remains the mandatory HTTP gate.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          preview_url="${preview_url%/}"
          code="$(curl --silent --show-error --location --retry 4 --retry-all-errors --output /tmp/preview-root --write-out '%{http_code}' "$preview_url/" || true)"
          if [[ "$code" == '401' || "$code" == '403' ]]; then
            echo "Preview is deployment-protected (${code}); Vercel check is accepted here and production remains the mandatory public smoke gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$code" == '200' ]] || { echo "Preview root returned ${code}." >&2; exit 1; }
          for path in /studio /docs /privacy /support /api/health /robots.txt /sitemap.xml; do
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors "${preview_url}${path}" --output /dev/null
          done
          echo "Preview smoke passed: ${preview_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Merge the exact verified release head
        if: steps.release.outputs.requires_merge == 'true'
        id: merge
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          response="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f sha="$RELEASE_SHA" \
            -f commit_title="feat: ship Tattoo Atelier reference app (#${PR_NUMBER})" \
            -f commit_message='Tattoo intelligence engine, Vercel studio, MCP/App tools, portable skills, privacy boundaries, evals, documentation and verified release gates.')"
          jq -e '.merged == true' <<<"$response" >/dev/null
          merge_sha="$(jq -r '.sha' <<<"$response")"
          echo "sha=${merge_sha}" >> "$GITHUB_OUTPUT"
          echo "Merged exact head as ${merge_sha}." >> "$GITHUB_STEP_SUMMARY"

      - name: Select the production commit
        id: production
        run: |
          set -euo pipefail
          if [[ '${{ steps.release.outputs.requires_merge }}' == 'true' ]]; then
            sha='${{ steps.merge.outputs.sha }}'
          else
            sha='${{ steps.source.outputs.main_sha }}'
          fi
          [[ -n "$sha" ]] || { echo 'Production SHA is empty.' >&2; exit 1; }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Wait for and smoke-test Vercel production
        id: live
        env:
          PRODUCTION_SHA: ${{ steps.production.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))
          production_url=''
          while (( SECONDS < deadline )); do
            deployments="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${PRODUCTION_SHA}&per_page=100" 2>/dev/null || echo '[]')"
            mapfile -t ids < <(jq -r '.[] | select((.environment // "") | ascii_downcase | contains("production")) | .id' <<<"$deployments")
            for id in "${ids[@]:-}"; do
              [[ -n "$id" ]] || continue
              statuses="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=100" 2>/dev/null || echo '[]')"
              if jq -e '.[] | select(.state == "failure" or .state == "error")' <<<"$statuses" >/dev/null; then
                echo "Production deployment ${id} failed." >&2
                exit 1
              fi
              production_url="$(jq -r '[.[] | select(.state == "success") | (.environment_url // .target_url // empty) | select(startswith("http"))][0] // empty' <<<"$statuses")"
              [[ -n "$production_url" ]] && break 2
            done

            fallback_code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$FALLBACK_PRODUCTION_URL/api/health" || true)"
            if [[ "$fallback_code" == '200' ]]; then
              production_url="$FALLBACK_PRODUCTION_URL"
              break
            fi
            sleep 15
          done
          [[ -n "$production_url" ]] || { echo 'No successful Vercel production URL became available.' >&2; exit 1; }
          production_url="${production_url%/}"

          for path in / /studio /docs /privacy /support /api/health /robots.txt /sitemap.xml; do
            curl --fail --silent --show-error --location --retry 8 --retry-all-errors "${production_url}${path}" --output "/tmp/production$(echo "$path" | tr '/.' '__')"
          done
          grep -Eqi 'ok|healthy|tattoo|atelier' /tmp/production_api_health

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --request POST "${production_url}/mcp" \
            --header 'content-type: application/json' \
            --header 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"tattoo-release-attestor","version":"1.0.0"}}}' \
            --output /tmp/production-mcp
          grep -Eqi 'result|event: message|protocolVersion' /tmp/production-mcp

          echo "url=${production_url}" >> "$GITHUB_OUTPUT"
          echo "Production smoke and MCP initialization passed: ${production_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release evidence
        env:
          PRODUCTION_SHA: ${{ steps.production.outputs.sha }}
          PRODUCTION_URL: ${{ steps.live.outputs.url }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          title='[release] Tattoo Atelier v1 — verified launch'
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search 'Tattoo Atelier v1 verified launch in:title' --json number,title --jq '.[] | select(.title == "[release] Tattoo Atelier v1 — verified launch") | .number' | head -n1)"
          evidence=/tmp/tattoo-release-evidence.md
          cat > "$evidence" <<EOF
          ## Verified release

          - [x] Immutable source material validated
          - [x] Deterministic dependency install
          - [x] Vertical contract validation
          - [x] Typecheck
          - [x] Automated tests
          - [x] Next.js production build
          - [x] Local runtime smoke
          - [x] GitHub checks
          - [x] Vercel production deployment
          - [x] Public website route smoke
          - [x] MCP initialize handshake
          - [x] Body-photo boundary remains browser-local
          - [x] External inference remains explicitly gated

          **Production commit:** \`${PRODUCTION_SHA}\`  
          **Website:** ${PRODUCTION_URL}  
          **Studio:** ${PRODUCTION_URL}/studio  
          **MCP/App endpoint:** ${PRODUCTION_URL}/mcp  
          **Documentation:** ${PRODUCTION_URL}/docs  
          **Pull request:** ${PR_URL:-already merged before reconciliation}

          The release is an artist-centered tattoo intelligence system and Vercel reference template, not an autonomous tattooing or stencil-generation system.
          EOF

          if [[ -z "$issue_number" ]]; then
            issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$evidence")"
            issue_number="${issue_url##*/}"
          else
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$evidence"
          fi
          gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed >/dev/null 2>&1 || true
          echo "Evidence issue: https://github.com/${GITHUB_REPOSITORY}/issues/${issue_number}" >> "$GITHUB_STEP_SUMMARY"

          release_notes=/tmp/tattoo-release-notes.md
          cp "$evidence" "$release_notes"
          if ! gh release view tattoo-atelier-v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create tattoo-atelier-v1.0.0 --repo "$GITHUB_REPOSITORY" --target "$PRODUCTION_SHA" --title 'Tattoo Atelier v1.0.0' --notes-file "$release_notes" --latest=false
          fi

      - name: Clean temporary release branches
        if: success()
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1 || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${CONTROL_BRANCH}" >/dev/null 2>&1 || true

      - name: Publish an actionable incident on failure
        if: failure()
        run: |
          set -euo pipefail
          title='[release] Tattoo Atelier reconciliation failed'
          body="The self-cleaning Tattoo Atelier release reconciliation stopped before verified completion. Inspect the exact failing gate: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No success attestation or v1.0.0 release was published by this run."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'Tattoo Atelier reconciliation failed in:title' --json number,title --jq '.[] | select(.title == "[release] Tattoo Atelier reconciliation failed") | .number' | head -n1)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
