name: Bootstrap Tattoo Atelier reference app

on:
  push:
    branches:
      - feat/tattoo-atelier-reference-app

permissions:
  contents: write

concurrency:
  group: bootstrap-tattoo-atelier
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/tattoo-atelier-reference-app
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Materialize verified overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/tattoo-overlay.part-* > /tmp/tattoo-overlay.tgz.b64
          base64 --decode /tmp/tattoo-overlay.tgz.b64 > /tmp/tattoo-overlay.tgz
          echo "9cd093a1cd07011f95ec74306d6f63277370411ce1c81253f26c88df3aa4d419  /tmp/tattoo-overlay.tgz" | sha256sum --check -
          tar -xzf /tmp/tattoo-overlay.tgz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-tattoo-atelier.yml

      - name: Refresh dependency lock
        run: pnpm install --no-frozen-lockfile

      - name: Validate Tattoo Atelier contracts
        run: pnpm validate:tattoo

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build production application
        run: pnpm build
        env:
          BASE_URL: http://127.0.0.1:3017
          TATTOO_PUBLIC_AI_ENABLED: "false"

      - name: Smoke-test production application and MCP App
        run: pnpm smoke:web

      - name: Commit verified release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: ship Tattoo Atelier reference vertical"
          git push origin HEAD:feat/tattoo-atelier-reference-app
